{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
        <a class="btn btn-outline-light btn-sm" href="{% url 'post_create' %}">New Post</a>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
  <div>
    {% if request.user.is_authenticated %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'post_create' %}">New Post</a>
      <span class="text-white ms-2">Hi, {{ request.user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
      </form>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
    {% endif %}
  </div>
</nav>
    
</body>
</html>
